services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: amulet-engine-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - TYPHOON_API_KEY=${TYPHOON_API_KEY}
      - TYPHOON_MODEL=${TYPHOON_MODEL:-typhoon-v2.5-30b-a3b-instruct}
    volumes:
      - ./backend/models:/app/models
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    container_name: amulet-engine-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    depends_on:
      backend:
        condition: service_healthy
